<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🏭 Idle Factory</h1>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">💰 Dinheiro:</span>
                    <span id="money" class="stat-value">$0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">⚡ Por segundo:</span>
                    <span id="moneyPerSecond" class="stat-value">$0</span>
                </div>
            </div>
        </header>

        <main class="game-main">
            <div class="click-section">
                <button id="clickButton" class="click-button">
                    <span class="click-icon">🖱️</span>
                    <span class="click-text">Clique aqui!</span>
                </button>
                <div class="click-info">
                    <span>Valor por clique: $<span id="clickValue">1</span></span>
                </div>
            </div>

            <div class="upgrades-section">
                <h2>🏪 Loja de Melhorias</h2>
                <div class="upgrades-grid" id="upgradesGrid">
                    <!-- Upgrades serão inseridos aqui via JavaScript -->
                </div>
            </div>

            <div class="achievements-section">
                <h2>🏆 Conquistas</h2>
                <div class="achievements-grid" id="achievementsGrid">
                    <!-- Achievements serão inseridos aqui via JavaScript -->
                </div>
            </div>
        </main>

        <footer class="game-footer">
            <button id="saveButton" class="save-button">💾 Salvar Jogo</button>
            <button id="resetButton" class="reset-button">🔄 Resetar</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
